  <!--
    010-client-buffer.conf
    Overrides the queue_size=5000 hardcoded in the plugin's ossec.conf template.

    WHY: the Wazuh manager (192.168.10.204) lives on The Archivist, which powers
    down 23:00 and wakes 07:45 - a ~9h nightly outage by design. Events produced
    while the manager is unreachable are held in this buffer and flushed on
    reconnect; anything beyond queue_size is dropped silently.

    SIZING: measured agent feed rate is ~1.1 events/sec once logging is disabled
    on the "Allow exit node routing over tailscale" rule (that rule alone was 69%
    of all firewall log volume). 9h x 1.1 eps = ~36,000 events. 50,000 leaves
    ~38% headroom. At ~203 bytes/event this costs ~10 MB RSS on a 3 GB box with
    no swap configured.

    NOTE: this produces a SECOND <client_buffer> block; the plugin template emits
    the first. Later block wins in wazuh-agentd. Verify after any plugin upgrade.
  -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>50000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>
