    onboot: true
    status: running
    ports:
      - { port: 22,   proto: tcp, service: sshd,           bind: all, via: direct }
      - { port: 80,   proto: tcp, service: Caddy HTTP,     bind: all, via: direct }
      - { port: 443,  proto: tcp, service: Caddy HTTPS (tls internal), bind: all, via: direct }
      - { port: 6556, proto: tcp, service: Checkmk agent,  bind: all, via: direct }
    routes:
      - { name: jellyfin.home.arpa,    upstream: "192.168.10.207:8096" }
      - { name: budget.home.arpa,      upstream: "192.168.10.206:3000" }
      - { name: vaultwarden.home.arpa, upstream: "192.168.10.205:8000" }
      - { name: ntfy.home.arpa,        upstream: "192.168.10.203:80", notes: plain HTTP }
      - { name: wazuh.home.arpa,       upstream: "192.168.10.204:443" }
      - { name: immich.home.arpa,      upstream: "192.168.10.208:2283" }
      - { name: checkmk.home.arpa,     upstream: "192.168.10.215:80" }
      - { name: actual.home.arpa,      upstream: "192.168.10.206:5006", notes: "Stale: Actual Budget retired, nothing listens on 5006" }
    web: null
    depends_on: [sentrygate]
    monitored: { checkmk: true, wazuh: "005" }
    backup: vzdump → PBS nightly 21:00

