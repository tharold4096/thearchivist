# Homelab inventory: the single machine-readable source of truth.
#
# Read by the website (host pages, topology, port tables) and by humans.
# Every value was read live on the date in `verified`; update that date only
# when you re-check the live system, not when you edit this file.
#
# Arr-stack containers (CT 109-114) are NOT listed here. They live in
# inventory.arr-stack.yml, which .gitignore keeps local.
#
# Field guide
#   slug        folder name under hosts/<group>/ and the id used in writeup front matter
#   kind        physical | lxc | vm | client
#   runs_on     slug of the parent machine (omit for physical/client)
#   status      running | stopped | planned | retired (as observed on `verified`)
#   ports       listening sockets reachable off-box (loopback-only omitted)
#               via: how a person normally reaches it (direct | caddy | tailscale)
#   depends_on  what must be up for this host to do its job
#   web         the URL a person actually opens

verified: 2026-11-12

networks:
  - id: lab-lan
    name: Lab LAN (Sentry Gate LAN)
    cidr: 192.168.10.0/24
    gateway: 192.168.10.1
    dhcp_pool: 192.168.10.100-192.168.10.200
    dns: 192.168.10.1 (Unbound + DNSBL on Sentry)
    domain: home.arpa
    notes: Static guests sit outside the DHCP pool. Proxmox bridge vmbr0.
  - id: family-lan
    name: Family LAN (home router)
    cidr: 192.168.1.0/24
    gateway: 192.168.1.1
    notes: Untouched by the lab. Sentry's WAN (bge0) is 192.168.1.223 on it; family devices never route through Sentry.
  - id: range
    name: Isolated range (vmbr1)
    cidr: null
    notes: Proxmox bridge with no physical port. Only range-gw and target-juice attach to it.
  - id: tailnet
    name: Tailscale tailnet
    cidr: 100.64.0.0/10
    notes: Remote admin path. Sentry advertises the lab LAN as a subnet route and offers an exit node.

hosts:
  # ---------------------------------------------------------------- physical
  - slug: sentrygate
    name: Sentry Gate
    kind: physical
    group: physical
    role: Inline firewall, router, DNS filter and Tailscale subnet router for the lab LAN
    hardware: Dell Inspiron 530 (2008), Core 2, ~3 GB DDR2, PNY CS900 250 GB SSD
    os: OPNsense 26.7.8_2 (FreeBSD)
    status: running
    formerly: Arch (July 2026 plan name)
    interfaces:
      - { name: bge0, role: WAN, ip: 192.168.1.223/24, network: family-lan, speed: 1000baseT }
      - { name: em0, role: LAN, ip: 192.168.10.1/24, network: lab-lan, speed: 100baseTX, notes: "Onboard 82562V-2 is 10/100 only: caps the lab at ~90 Mbit/s" }
      - { name: tailscale0, role: VPN, ip: 100.116.54.77, network: tailnet }
    ports:
      - { port: 22,    proto: tcp, service: sshd,       bind: all,          via: tailscale }
      - { port: 53,    proto: tcp/udp, service: Unbound DNS + DNSBL, bind: all, via: direct }
      - { port: 67,    proto: udp, service: dnsmasq DHCP, bind: all,        via: direct }
      - { port: 80,    proto: tcp, service: OPNsense web UI (redirect), bind: all, via: direct }
      - { port: 443,   proto: tcp, service: OPNsense web UI, bind: all,     via: tailscale }
      - { port: 123,   proto: udp, service: ntpd,       bind: all,          via: direct }
      - { port: 161,   proto: udp, service: "snmpd (SNMPv3, Checkmk)", bind: 192.168.10.1, via: direct }
      - { port: 3493,  proto: tcp, service: upsd (NUT server), bind: 192.168.10.1, via: direct }
      - { port: 41641, proto: udp, service: tailscaled, bind: all,          via: direct }
    web: https://192.168.10.1
    depends_on: []
    monitored: { checkmk: true, wazuh: "001" }
    backup: OPNsense config export (kept off-repo; never committed)

  - slug: thearchivist
    name: The Archivist
    kind: physical
    group: physical
    role: Proxmox VE hypervisor running every lab service
    hardware: Dell PowerEdge R710, 24 threads (2x Xeon E5645), 94 GiB RAM, PERC 6/i
    os: Proxmox VE 9.2.26 (kernel 7.0.14-28-pve)
    status: running
    schedule: Powers off 23:00, RTC wake 07:45 (nightly-poweroff cron)
    interfaces:
      - { name: vmbr0, role: LAN bridge (nic0), ip: 192.168.10.202/24, network: lab-lan }
      - { name: vmbr1, role: Isolated range bridge, ip: null, network: range }
      - { name: idrac, role: Out-of-band management, ip: 192.168.10.245, network: lab-lan, notes: "Not answering on 443 at 2026-11-12 check" }
    storage:
      - { id: local,     type: dir,     device: "sda (232 GB, PERC VD)", use: "ISOs, templates, host root" }
      - { id: local-lvm, type: lvmthin, device: sda, size: 150 GiB, use: "Guest root disks (60% full, 2.35x overprovisioned)" }
      - { id: archive,   type: dir,     device: sdb (931 GB), use: "Immich library, Takeout, DNS logs, samba share, budget backups" }
      - { id: bulk2t,    type: dir,     device: sdc (1.8 TB), use: Media library and torrents (/data) }
      - { id: pbs,       type: pbs,     device: "sdd (1.8 TB, passed through to VM 150)", use: "vzdump + file-level backups" }
    ports:
      - { port: 22,   proto: tcp, service: sshd,                  bind: all, via: direct }
      - { port: 111,  proto: tcp, service: rpcbind,               bind: all, via: direct }
      - { port: 3128, proto: tcp, service: spiceproxy,            bind: all, via: direct }
      - { port: 6556, proto: tcp, service: Checkmk agent,         bind: all, via: direct }
      - { port: 8006, proto: tcp, service: Proxmox web UI / API,  bind: all, via: direct }
    web: https://192.168.10.202:8006
    depends_on: [sentrygate]
    monitored: { checkmk: true, wazuh: "002" }
    backup: Host config not backed up by PBS; configs live in this repo

