  <!--
    020-localfile-dnsbl.conf
    Ingest Unbound DNSBL block events produced by /usr/local/sbin/unbound-dnsbl-wazuh.

    WHY: OPNsense never sends DNSBL blocks to syslog. The dnsbl_module writes
    them to the FIFO /var/unbound/data/dns_logger, whose only stock consumer
    (scripts/unbound/logger.py) stores them in SQLite for the Reporting UI.
    The bridge daemon attaches to that FIFO and re-emits blocks as JSON lines.

    log_format json means Wazuh's built-in JSON decoder extracts every key
    automatically - no custom decoder is needed, and every field (srcip,
    domain, blocklist, policy_id) is individually searchable in the dashboard.

    Volume: only blocked queries are written, and the DNSBL policy is scoped to
    three Tailscale source addresses, so this is a low-rate feed compared to
    filterlog.
  -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/unbound-dnsbl/blocks.log</location>
  </localfile>
