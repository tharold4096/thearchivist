#!/usr/sbin/nft -f
# /etc/nftables.conf on CT 116 (responder). Only port 8787 is filtered; everything else stays open.
# Sentry passes the whole tailnet to the LAN (rule 103, open finding), so CT 116 restricts its own port:
#   192.168.10.1   = Sentry: tailnet traffic (the iPhone's buttons) arrives SNATed from here
#   192.168.10.215 = Checkmk (CT 115) posting alerts
# The single-use tokens stay the real control; this just shrinks who can reach the service.
flush ruleset

table inet responder {
    set allowed_8787 {
        type ipv4_addr
        elements = { 192.168.10.1, 192.168.10.215, 192.168.10.216, 127.0.0.1 }
    }

    chain input {
        type filter hook input priority filter; policy accept;
        tcp dport 8787 ip saddr != @allowed_8787 counter log prefix "responder-8787-drop " drop
        tcp dport 8787 meta nfproto ipv6 counter drop
    }
}
